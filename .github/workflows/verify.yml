name: Verify site

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - '.github/workflows/verify.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Screenshot preview
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mathim-http.log 2>&1 &
          sleep 2
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --screenshot=/tmp/mathim-desktop.png --window-size=1440,1000 --virtual-time-budget=2000 http://localhost:4173/
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --screenshot=/tmp/mathim-mobile.png --window-size=390,844 --virtual-time-budget=2000 http://localhost:4173/
          python3 - <<'PY'
          import base64
          for label in ('desktop','mobile'):
              with open(f'/tmp/mathim-{label}.png','rb') as f: data = base64.b64encode(f.read()).decode('ascii')
              print(f'MATHIM_PREVIEW_{label.upper()}_START')
              for i in range(0,len(data),160): print(data[i:i+160])
              print(f'MATHIM_PREVIEW_{label.upper()}_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathim-redesign-preview
          path: |
            dist/
            /tmp/mathim-desktop.png
            /tmp/mathim-mobile.png
