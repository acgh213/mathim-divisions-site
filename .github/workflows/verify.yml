name: Verify site

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'astro.config.mjs'
      - '.github/workflows/verify.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Screenshot and route verification
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/mathim-http.log 2>&1 &
          sleep 2
          mkdir -p /tmp/mathim-screens
          for entry in "overview /" "organization /about/" "divisions /services/" "contact /contact/"; do
            set -- $entry
            name=$1
            route=$2
            curl --fail --silent --show-error "http://localhost:4173$route" > /dev/null
            google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --screenshot="/tmp/mathim-screens/$name-desktop.png" --window-size=1440,4400 --virtual-time-budget=1800 "http://localhost:4173$route"
            google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --screenshot="/tmp/mathim-screens/$name-mobile.png" --window-size=390,6200 --virtual-time-budget=1800 "http://localhost:4173$route"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathim-corporate-review
          path: |
            dist/
            /tmp/mathim-screens/
          retention-days: 21
